<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Apenas uma página para eu ir treinando um básico de interação de HTML e CSS">
    <title>Página pra treinar a adição de tasks</title>

    <link rel="stylesheet" href="task.css">
    <script defer src="task.js"></script>
</head>


<body>
    
    <div class="container">
        <div class="direita">
            <h1>Adicione mais itens na lista!</h1>
            <input type="text" id="item" placeholder="Texto para ser adicionado">
            <button id="adiciona">ADICIONAR</button>
        </div>
        
        <hr class="linha">
        
        <div class="esquerda">
            <h2>Veja, essa é a lista!</h2>
            <ul id="lista">
                <li>Esse é o primeiro item, adicione mais!</li>
            </ul>
        </div>
    </div>

</body>
</html>
