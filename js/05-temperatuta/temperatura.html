<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta description="Apenas outro treino, dessa vez, um pouco parecido com os outros, sem nada de mais">
    <title>Conversor de celcius para fahrenheit</title>
    <link rel="stylesheet" href="temperatura.css">
    <script defer src="temperatura.js"></script>
</head>


<body>

    <div class="corpo">
        <h1>Conversor de temperatura</h1>

        <select id="option">
            <option value="c_to_f">Celcius para fahrenheit</option>
            <option value="f_to_c">fahrenheit para celcios</option>
        </select>

        <div id="convert">
            <input type="number" id="op1">
            <input type="number" id="op2">
        </div>

    </div>    

</body>
