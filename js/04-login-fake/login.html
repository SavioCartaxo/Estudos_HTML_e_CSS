<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tentando construir uma página de Login Fake</title>
    <link rel="stylesheet" href="login.css">
    <script defer src="login.js"></script>
</head>

<body>
    
<div class="cont">
    <div class="direita">
        
        <h1>Login</h1>
        
        <div class="p2">
            <p>Email</p>
            <input type="text" placeholder="Insira email..." id="email">
            <p>Senha</p>
            <input type="text" placeholder="Insira senha..." id="passworld">
            
            <div class="box">
                <input type="checkbox" id="termos">
                <label for="termos">Declaro que li e concordo com os termos e politicas da empresa.</label>
            </div>
            
            <button id="bt">Continue</button>
        </div>
    
    </div>
    
    <div class="esquerda"></div>
    
</div>

</body>
</html>
